name: CI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push할 때 실행
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'   # 현재 로컬에서 쓰는 Node 버전

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # - name: Run tests
      #  run: npm test   # 테스트 스크립트가 있으면 실행
